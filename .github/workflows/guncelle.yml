name: son-haberler
# Her 30 dakikada bir İchizo Terminal'in yayınlanmış haberlerini son-haberler.json'a yazar.
# Herkese açık depoda GitHub Actions ücretsizdir; site ziyaretçileri Replit'e istek atmaz.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: son-haberler
  cancel-in-progress: false
jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/guncelle.mjs
      - name: commit
        run: |
          if git diff --quiet; then echo "değişiklik yok"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add son-haberler.json
          git commit -m "son-haberler: güncelle"
          git push
